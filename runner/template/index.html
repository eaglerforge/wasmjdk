<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVM.js</title>
    <style>
        /*
        html {
            filter: invert(1)
        } */
        html,
        body {
            background: rgb(230, 230, 230);
            text-align: center;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            cursor: default;
        }

        h2 {
            text-shadow: 0.75px 0.75px 0px rgba(0, 0, 0, 0.5);
            display: block;
            text-decoration: underline;
        }

        @font-face {
            font-family: 'unifont';
            src: url('unifont.woff2') format('woff2');
            font-weight: lighter;
            font-style: normal;
            font-display: swap;
        }

        * {
            font-family: 'unifont', monospace;
        }

        button,
        select {
            border: 2px outset white;
            font-family: 'unifont', monospace;
            background: rgb(230, 230, 230);
            color: black;
            margin-right: 5px;
            margin-bottom: 6px;
            height: 1.5rem;
            line-height: 1.2rem;
            outline: 0px;
            font-size: 0.75rem;
            display: inline-block;
            cursor: pointer;
        }

        button:active,
        select:active {
            border-style: inset;
        }

        #output {
            text-align: left;
            border: 2px inset white;
            background: rgb(230, 230, 230);
            display: inline-block;
            max-width: 50vw;
            cursor: text;
            padding: 4px;
        }

        ::selection {
            background-color: rgb(98, 131, 131);
        }

        #titlebar {
            display: block;
            width: calc(100vw - 10px);
            background: rgb(0, 116, 183);
            height: 1.25rem;
            align-content: center;
            text-align: left;
            padding-left: 4px;
            color: white;
            border-width: 3px;
            border-style: outset;
            border-color: rgb(154, 186, 205);
        }

        #canvas {
            position: fixed;
            right: 0;
            bottom: 0;
            border: 1px solid black;
        }
        input[type=search] {
            position: fixed;
            bottom: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="titlebar">
        JVM.js Demo Page
    </div>
    <h2>JVM.js</h2>
    <p>Experimental web port of OpenJDK 25 Zero Variant</p>
    <script>globalThis.JVM_LOC = location.host.endsWith(".github.io") ? "https://media.githubusercontent.com/media/eaglerforge/wasmjdk/refs/heads/main/docs/jvm.wasm" : "jvm.wasm";</script>
    <script src="jvm.js"></script>
    <select id="test"></select><button id="runtest">.main()</button>
    <br>
    <br>
    <span id="stdout_title">Runtime Info: </span><br>
    <span id="output" spellcheck="false" autocapitalize="off" autocorrect="off"></span>
    <script src="coi-sw.min.js"></script>
    <canvas id="canvas" width="300" height="200"></canvas>
    <input type="search" value="_gl4es_glAlphaFunc" oninput="checkSymbol(this)">
    <script>
        function checkSymbol(input) {
            let name = input.value;
            const ptr = JVM._malloc(name.length + 1);
            for (let i = 0; i < name.length; i++) {
                JVM.HEAPU8[i + ptr] = name.charCodeAt(i) & 0xFF;
                JVM.HEAPU8[i + ptr + 1] = 0;
            }
            const rtld = JVM.___wrap_dlopen(0);
            const symbol = JVM.___wrap_dlsym(rtld, ptr); //three underscores is crazy work
            console.log("SymID: " + symbol);
            if (!symbol) {
                const errorPtr = JVM._dlerror();
                const errorStr = errorPtr ? JVM.UTF8ToString(errorPtr) : "Unknown Error";
                console.error("dlopen(0) failed: " + errorStr);
            }
            JVM._free(ptr);
        }
        let term = "";

        const out = document.querySelector("#output");

        function updateRender() {
            out.innerText = term;
        }

        async function getJarFiles() {
            return new Promise((resolve, reject) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.accept = '.jar';
                input.onchange = async (e) => {
                    const files = [...e.target.files];
                    const outArrays = {};
                    for (const fil of files) {
                        outArrays[fil.name] = new Uint8Array(await fil.arrayBuffer());
                    }
                    console.log(outArrays);
                    resolve(outArrays);
                };
                input.oncancel = () => resolve(null);
                input.click();
            });
        }

        const originalQuerySelector = document.querySelector;
        document.querySelector = function (...args) {
            if (args[0] === "Module['canvas']") {
                args[0] = "#canvas"; //fix for buggy emscripten
            }
            return originalQuerySelector.apply(this, args);
        }

        const init = (async function () {
            var javaInputQueue = "test\n".split("").map(x => x.charCodeAt(0));
            const buildInfo = await (await fetch("rt/rt.info")).text();
            out.innerHTML = `${buildInfo}\nSHARED_ARR_BUF="${"SharedArrayBuffer" in globalThis}"`.replaceAll("\n", "<br>");
            const canvas = document.querySelector("#canvas");
            const JVM = await initJVM({
                locateFile: (file, scrDir) => {
                    if (file.startsWith("http:") || file.startsWith("https:")) {
                        return file;
                    }
                    return scrDir + file;
                },
                canvas: canvas
            });
            globalThis.JVM = JVM;

            const rt = new Uint8Array(await (await fetch("rt/modules")).arrayBuffer());

            JVM.FS.mkdirTree("/home/web_user/classes");
            JVM.FS.mkdirTree("/home/web_user/condiments");
            JVM.FS.mkdirTree("/home/web_user/lib");
            JVM.FS.mkdirTree("/lib");
            JVM.FS.writeFile("/home/web_user/lib/modules", rt);
            JVM.FS.writeFile("/lib/modules", rt);
            JVM.FS.mkdirTree(`/lib/linux/x86/org/lwjgl/opengles/`);
            JVM.FS.mkdirTree(`/lib/linux/x86/org/lwjgl/opengl/`);
            JVM.FS.mkdirTree(`/conf/security/`);
            JVM.FS.writeFile("/conf/security/java.security", new Uint8Array(await (await fetch("java.security")).arrayBuffer()));
            JVM.FS.writeFile("/lib/tzdb.dat", new Uint8Array(await (await fetch("rt/tzdb.dat")).arrayBuffer()));

            const GHOST = new Uint8Array(0); //get java to stfu about missing libraries
            ["libjimage", "libjava", "libnet", "libnio", "libzip",
                "libverify", "libjsig", "liblwjgl", "libglfw", "liblwjgl_opengles",
                "linux/x86/org/lwjgl/opengles/liblwjgl_opengles",
                "linux/x86/org/lwjgl/opengl/liblwjgl_opengl",
                "linux/x86/org/lwjgl/liblwjgl",
                "liblwjgl_opengl", "libmanagement"].forEach(lib => {
                    JVM.FS.writeFile(`/lib/${lib}.so`, GHOST);
                });

            const testSelector = document.querySelector("#test");
            const testDB = (await (await fetch("tests.txt")).text()).split("\n").map(x => x.trim()).filter(x => x && !x.startsWith("#"));
            testDB.reverse();
            testDB.forEach(v => {
                const opt = new Option(v, v);
                testSelector.appendChild(opt);
            });
            const custom_opt = new Option("CustomJar", "CustomJar");
            testSelector.appendChild(custom_opt);
            const libs = [
                "lwjgl-egl.jar",
                "lwjgl-glfw.jar",
                "lwjgl-opengles.jar",
                "lwjgl-opengl.jar",
                "lwjgl-openal.jar",
                "lwjgl-stb.jar",
                "lwjgl-unsafe.jar",
                "lwjgl.jar",
                "HelloWorld.jar"
            ];
            document.querySelector("#runtest").addEventListener("click", async () => {
                for (const library of libs) {
                    let url = `classpath/${library}`;
                    if (location.hostname.endsWith("github.io")) {
                        url = "https://media.githubusercontent.com/media/eaglerforge/wasmjdk/refs/heads/main/docs/" + url;
                    }
                    const lib = new Uint8Array(await (await fetch(url)).arrayBuffer());
                    JVM.FS.writeFile("/home/web_user/condiments/" + library, lib);
                    console.log("Loaded: " + library + " into classpath")
                }
                let cname = "Main";
                if (testSelector.value === "CustomJar") {
                    const JarBuffers = await getJarFiles();
                    Object.entries(JarBuffers).forEach(ent => {
                        JVM.FS.writeFile("/home/web_user/condiments/"+ent[0], ent[1]);
                        console.log("[FS] Wrote to classpath: " + ent[0]);
                    });
                    let defaultVal = localStorage.getItem("lastCallfunc") || "net/minecraft/client/main/Main --accessToken 0 --version 1.13.0 --username ZXMushroom63 --gameDir .";
                    cname = prompt("Entry class: ", defaultVal);
                    localStorage.setItem("lastCallfunc", cname);
                } else {
                    let url = `compiled_tests/${testSelector.value}.jar`;
                    if (location.hostname.endsWith("github.io")) {
                        url = "https://media.githubusercontent.com/media/eaglerforge/wasmjdk/refs/heads/main/docs/" + url;
                    }
                    const MainJar = new Uint8Array(await (await fetch(url)).arrayBuffer());
                    JVM.FS.writeFile("/home/web_user/condiments/Main.jar", MainJar);
                }

                let classNamePtr = JVM._malloc(cname.length + 1);
                const className = JVM.HEAPU8.subarray(classNamePtr, classNamePtr + cname.length + 1);

                for (let i = 0; i < (cname.length + 1); i++) {
                    className[i] = 0xFF & (cname.charCodeAt(i) || 0);
                }

                document.querySelector("#stdout_title").innerText = "Output Log: ";
                out.innerText = "";

                //stdinPtr = JVM._stdin_ptr();alloc_fake_stdinalloc_fake_stdinalloc_fake_stdin
                //const stdinBuffer = JVM.HEAPU8.subarray(stdinPtr, stdinPtr + STDIN_SIZE);
                //const stdinSync = new Int32Array(JVM.HEAPU8.buffer, stdinPtr, 1);

                const stdinPtr = globalThis.stdinPtr = JVM._alloc_fake_stdin();
                const stdinBuf = globalThis.stdinBuf = JVM.HEAPU8.subarray(stdinPtr, stdinPtr + 2048);

                globalThis.EXEC_START_TIME = performance.now();
                JVM.__Z19run_classfile_proxyPc(classNamePtr);

                addEventListener("keydown", (e) => {
                    let mapping = {
                        Enter: 10,
                        Backspace: 8
                    }
                    let keyCode = -1;
                    console.log(e.key, e.keyCode);
                    if (mapping[e.key]) {
                        keyCode = mapping[e.key];
                    } else if (e.key.length === 1) {
                        keyCode = e.key.charCodeAt(0);
                    }
                    if (keyCode === -1) {
                        return;
                    }
                    console.log("Attempting keycode push for: ", keyCode);
                    const res = JVM._fake_stdin_push_char(keyCode & 0xff);
                    if (res === 1) {
                        if (keyCode === 8) {
                            term = term.slice(0, term.length - 1);
                        } else {
                            term += String.fromCharCode(keyCode);
                        }
                        updateRender();
                    }
                });
            });
        });
        if (!location.search.includes("debug")) {
            init()
        }

        const originalLog = console.log;
        console.log = function (...args) {
            if (typeof args[0] === "string" && args.length === 1
                && !args[0].startsWith("Calling method:")
                && !args[0].startsWith("[EMDEBUG]")
                && !args[0].includes("[class,load]")
            ) {
                if (args[0].includes("JVM Exited")) {
                    const perf = (performance.now() - globalThis.EXEC_START_TIME);
                    console.log("Runtime exited in: " + perf + "ms.");
                }
                term += args[0] + "\n";
                updateRender();
            }
            originalLog.apply(this, args);
        }

        const originalErr = console.error;
        console.error = function (...args) {
            if (typeof args[0] === "string" && args.length === 1) {
                if (args[0].includes("/emsdk/emscripten/system/lib/html5/callback.c")) {
                    return; //not important
                }
                if (args[0].includes("wasm streaming compile failed")) {
                    return;
                }
                if (args[0].includes("falling back to ArrayBuffer instantiation")) {
                    return;
                }
                term += "[stderr] " + args[0] + "\n";
                updateRender();
            }
            originalErr.apply(this, args);
        }

        out.addEventListener("dragend", (e) => {
            e.preventDefault();
        });

        out.addEventListener("paste", (e) => {
            e.preventDefault();
        });
    </script>
</body>

</html>
